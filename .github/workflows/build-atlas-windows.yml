name: Build ATLAS (Windows)

# Builds a Windows export of ATLAS (Godot 4.7.2 .NET) and zips it.
#  - every push to the atlas branch / main  -> zip is attached to the run as an artifact (Actions tab)
#  - pushing a tag like v0.1.0              -> the zip is also attached to a GitHub Release anyone can download
#  - Actions tab -> "Run workflow"          -> manual build
on:
  push:
    branches: [atlas, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  PROJECT_DIR: ATLAS
  PRESET: Windows Desktop

jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Godot (.NET) and its export templates
        shell: pwsh
        run: |
          $v = "${{ env.GODOT_VERSION }}-stable"
          $base = "https://github.com/godotengine/godot/releases/download/$v"
          Invoke-WebRequest "$base/Godot_v${v}_mono_win64.zip" -OutFile godot.zip
          Invoke-WebRequest "$base/Godot_v${v}_mono_export_templates.tpz" -OutFile templates.zip
          Expand-Archive godot.zip -DestinationPath godot
          Expand-Archive templates.zip -DestinationPath tpl
          $dest = Join-Path $env:APPDATA "Godot/export_templates/${{ env.GODOT_VERSION }}.stable.mono"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item tpl/templates/* $dest -Recurse
          $exe = Get-ChildItem godot -Recurse -Filter "*_console.exe" | Select-Object -First 1
          "GODOT=$($exe.FullName)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Import assets and build the C# solution
        shell: pwsh
        run: |
          & $env:GODOT --headless --path $env:PROJECT_DIR --import
          & $env:GODOT --headless --path $env:PROJECT_DIR --build-solutions --quit
          if ($LASTEXITCODE -ne 0) { throw "C# build failed" }

      - name: Export Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/ATLAS | Out-Null
          $out = Join-Path $PWD "build/ATLAS/ATLAS.exe"
          & $env:GODOT --headless --path $env:PROJECT_DIR --export-release "$env:PRESET" $out
          if (-not (Test-Path $out)) { throw "Export did not produce ATLAS.exe" }
          Get-ChildItem build/ATLAS | Format-Table Name, Length

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/ATLAS/* -DestinationPath ATLAS-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS-windows-x64
          path: ATLAS-windows-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ATLAS-windows-x64.zip
          generate_release_notes: true
